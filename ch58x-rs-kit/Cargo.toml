[package]
name = "ch58x-rs-kit"
version = "0.1.0"
edition = "2021"
description = "Shared code for CH58x boards: logging, BLE peripheral services, settings storage, shift-register LED driver"
license = "MIT"

[lib]
# no_std firmware library: no test harness on the target
test = false

[dependencies]
ch58x-hal.workspace = true
critical-section.workspace = true
qingke.workspace = true
qingke-rt.workspace = true
embedded-hal-local.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embassy-time-driver.workspace = true

[dev-dependencies]
abc-note-stream.workspace = true
spi-memory.workspace = true
